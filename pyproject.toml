[project]
name = "midnight-stats"
version = "0.1.0"
description = "Live calendar, standings and player stats for the L'Alqueria del Basket senior league"
requires-python = ">=3.10"
dependencies = ["pdfplumber>=0.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
